{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="user-form">
  <div class="login-form">
    <h2>Вход</h2>
    {% include 'accounts/login_form.html' %}
    <div class="user-registr">
      {% if form.errors %}
        <p>Вы ввели неверный username или password.Попробуйте снова.</p>
      {% else %}
        <p>Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
