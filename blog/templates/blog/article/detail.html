<!-- Здесь прописываются то, как будет выглядеть каждая отдельная статья -->


{% extends 'base.html' %}

{% block content  %}
<main>
   <div class="container">

      <div class="path_category">
         <p class="path"><a href="{% url 'blog:article_list'  %}">Главная</a> / {{article.title}}</p>
      </div>
      <div class="article-choice">
         <div class="article-item">
            <!-- Автор -->
            <div class="author-article">
               <p class="author-name">{{article.author}}</p>
               <p class="data">{{article.publish|date:"j M Y"}}</p>
            </div>
            <!-- О статье -->
            <div class="article-about">
               <h2>{{article.title| safe}}</h2>
               <p>{{article.summary| safe}}<p>
            </div>
            <img src="{{article.image.url}}" alt="foto">
            <!-- Полный текст -->
            <div class="article-fultext">{{article.full_text|safe}}
         </div>
      </div>
   </div>
</main>
{% endblock  %}
