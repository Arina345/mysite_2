{% extends "base.html" %}
{% block title %}Удалить статью{% endblock %}



{% block content %}
<div class="user-form">
    <div class="article-delete">
        <h2>Вы действительно хотите удалить статью: "{{ object }}"?</h2>
         <form action="" method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-delete-article" value="Удалить">Удалить</button>
        </form>
    </div>
</div>
{% endblock %}
